name: popular_football
description: تطبيق طوبة - منصة كرة القدم الشعبية
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  firebase_app_check: ^0.4.1+4
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.1.3
  cloud_functions: ^6.0.7

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Media
  image_picker: ^1.2.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  shared_preferences: ^2.2.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^8.3.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  pdf: ^3.12.0
  printing: ^5.14.3
  marquee: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  firebase_auth_mocks: ^0.15.1
  fake_cloud_firestore: ^4.0.1
  mockito: ^5.6.3
  build_runner: ^2.11.0
  firebase_core_platform_interface: ^6.0.2
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

# ============================================================
# إعدادات توليد أيقونات التطبيق (flutter_launcher_icons)
# ============================================================
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/defaults/avatars/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
