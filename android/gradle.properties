# 📝 ذاكرة عملية Gradle الرئيسية (رُفعت من 2G إلى 4G لدعم البناء وترجمة Kotlin).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# 📝 ذاكرة مخصّصة لخادم ترجمة Kotlin — الإصلاح الأساسي لخطأ
# «Could not connect to Kotlin compile daemon» (يفشل غالباً لنقص الذاكرة/بطء الإقلاع).
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# 📝 تسريع البناء (آمن على ويندوز والماك): بناء متوازٍ + كاش + تهيئة عند الطلب.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
